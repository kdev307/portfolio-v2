<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0B" />

    <title>dev — Software Development Engineer</title>
    <meta
      name="description"
      content="Dev is a Software Development Engineer at Auriga IT building thoughtful web experiences with AEM, React and TypeScript. An engineer who enjoys understanding systems and building maintainable software."
    />
    <meta name="author" content="Dev" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="dev — Software Development Engineer" />
    <meta
      property="og:description"
      content="Building thoughtful web experiences. AEM, React, TypeScript, Micro Frontends."
    />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0a0a0b;
        transition: opacity 1s ease, visibility 1s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      /* rounded block with a laser beam tracing its border */
      #initial-loader .il-card {
        position: relative;
        display: grid;
        place-items: center;
        padding: 20px 42px;
        border-radius: 18px;
        background: #0a0a0b;
        overflow: hidden;
        isolation: isolate;
      }
      #initial-loader .il-card::before {
        content: "";
        position: absolute;
        z-index: -2;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg 288deg,
          rgba(190, 242, 100, 0.2) 316deg,
          #bef264 344deg,
          #f2ffca 352deg,
          #bef264 359deg,
          transparent 360deg
        );
        animation: il-spin 2s linear infinite;
      }
      /* mask the interior so only a thin border ring shows the beam */
      #initial-loader .il-card::after {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 2px;
        border-radius: 16px;
        background: #0a0a0b;
      }
      #initial-loader .il-brand {
        position: relative;
        z-index: 1;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: clamp(26px, 7vw, 34px);
        letter-spacing: -0.02em;
        color: #f4f4f5;
      }
      #initial-loader .il-brand i {
        color: #bef264;
        font-style: normal;
      }
      @keyframes il-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .il-card::before {
          animation: none;
          background: #bef264;
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="il-card">
        <span class="il-brand"><i>.</i>dev</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
